<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
  <title>Сайт готовится к запуску</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #101315; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh;
      display: grid; place-items: center; padding: 28px;
      color: #f4f5f2; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(100%, 620px); padding: clamp(32px, 7vw, 64px);
      border: 1px solid #2b3032; border-radius: 28px; background: #161a1c;
    }
    .status {
      display: flex; align-items: center; gap: 10px; margin: 0 0 30px;
      color: #b6c7b6; font-size: 13px; font-weight: 600; letter-spacing: .08em;
    }
    .status::before { content: ""; width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; background: #a8c79f; }
    h1 { margin: 0; max-width: 470px; font-size: clamp(32px, 6vw, 46px); line-height: 1.13; font-weight: 600; letter-spacing: -.045em; text-wrap: balance; }
    .note { margin: 24px 0 0; color: #a7adb0; font-size: 17px; line-height: 1.6; }
    @media (max-width: 380px) { body { padding: 18px; } main { padding: 28px; } }
  </style>
</head>
<body>
  <main>
    <p class="status">СКОРО</p>
    <h1>Сайт готовится к запуску</h1>
    <p class="note">Загляните немного позже.</p>
  </main>
</body>
</html>
